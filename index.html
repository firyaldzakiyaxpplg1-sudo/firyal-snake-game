<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game - Mini Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         SPLASH SCREEN
    ====================================================== -->
    <section id="splashScreen" class="screen splash-screen">
        <div class="decor decor-1"></div>
        <div class="decor decor-2"></div>
        <div class="decor decor-3"></div>
        <div class="decor decor-4"></div>

        <div class="splash-panel">
            <div class="mini-snake">
                <span class="snake-head"></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <h1>SNAKE GAME</h1>
            <p class="splash-subtitle">Mini Project Pygame</p>

            <p class="loading-text" id="loadingText">
                Menyiapkan permainan
            </p>

            <div class="loading-bar">
                <div id="loadingProgress"></div>
            </div>

            <p class="splash-footer">Eat • Grow • Survive</p>
        </div>
    </section>


    <!-- =====================================================
         MENU
    ====================================================== -->
    <section id="menuScreen" class="screen hidden">
        <div class="game-background"></div>

        <div class="menu-panel">

            <div class="mini-snake menu-snake">
                <span class="snake-head"></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <h1>SNAKE GAME</h1>

            <p class="menu-subtitle">
                MINI PROJECT PYGAME
            </p>

            <p class="menu-description">
                Makan makanan • Perbesar ular • Raih skor
            </p>

            <button id="startButton" class="main-button start-button">
                START
            </button>

            <button id="exitButton" class="main-button exit-button">
                KELUAR
            </button>

            <p class="instruction">
                ENTER = Mulai &nbsp;&nbsp;&nbsp; ESC = Keluar
            </p>

        </div>
    </section>


    <!-- =====================================================
         GAME
    ====================================================== -->
    <section id="gameScreen" class="screen hidden">

        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div class="hud">

            <div class="hud-card score-card">
                <span>SKOR</span>
                <strong id="score">0</strong>
            </div>

            <div class="hud-card level-card">
                <span>LEVEL</span>
                <strong id="level">1</strong>
            </div>

            <div class="hud-card control-card">
                ARROW / WASD / TOUCH
            </div>

        </div>

        <!-- NICE -->
        <div id="niceText" class="nice-text">
            NICE! +1
        </div>

        <!-- KONTROL HP -->
        <div id="mobileControls" class="mobile-controls">

            <button class="control-button up" data-direction="up">
                ▲
            </button>

            <button class="control-button left" data-direction="left">
                ◀
            </button>

            <button class="control-button right" data-direction="right">
                ▶
            </button>

            <button class="control-button down" data-direction="down">
                ▼
            </button>

        </div>


        <!-- =================================================
             GAME OVER
        ================================================== -->
        <div id="gameOverOverlay" class="game-over-overlay hidden">

            <div class="game-over-panel">

                <div class="game-over-icon">
                    <span>×</span>
                </div>

                <h2>GAME OVER</h2>

                <p>
                    Skor Akhir:
                    <strong id="finalScore">0</strong>
                </p>

                <div class="game-over-buttons">

                    <button id="restartButton" class="main-button start-button">
                        RESTART
                    </button>

                    <button id="gameExitButton" class="main-button exit-button">
                        KELUAR
                    </button>

                </div>

                <small>
                    Klik tombol atau tekan R / ESC
                </small>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
