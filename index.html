<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Mini Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="gameCanvas"></canvas>

    <!-- SPLASH SCREEN -->
    <div id="splashScreen" class="screen splash-screen">
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>
        <div class="decoration decoration-4"></div>

        <div class="splash-panel">

            <div class="mini-snake splash-snake">
                <div class="mini-head"></div>
                <div class="mini-body body1"></div>
                <div class="mini-body body2"></div>
                <div class="mini-body body3"></div>
                <div class="mini-body body4"></div>
            </div>

            <h1>SNAKE GAME</h1>

            <p class="subtitle">Mini Project Pygame</p>

            <p id="loadingText">Menyiapkan permainan</p>

            <div class="loading-bar">
                <div id="loadingProgress"></div>
            </div>

            <p class="eat-text">Eat • Grow • Survive</p>
        </div>
    </div>


    <!-- MENU -->
    <div id="menuScreen" class="screen hidden">
        <div class="menu-panel">

            <div class="mini-snake menu-snake">
                <div class="mini-head"></div>
                <div class="mini-body body1"></div>
                <div class="mini-body body2"></div>
                <div class="mini-body body3"></div>
                <div class="mini-body body4"></div>
            </div>

            <h1>SNAKE GAME</h1>

            <p class="menu-subtitle">MINI PROJECT PYGAME</p>

            <p class="description">
                Makan makanan • Perbesar ular • Raih skor
            </p>

            <button id="startButton" class="main-button">
                START
            </button>

            <button id="exitMenuButton" class="exit-button">
                KELUAR
            </button>

            <p class="instruction">
                ENTER = Mulai &nbsp;&nbsp;&nbsp; ESC = Keluar
            </p>

        </div>
    </div>


    <!-- HUD -->
    <div id="hud" class="hidden">

        <div class="hud-card score-card">
            SKOR <span id="score">0</span>
        </div>

        <div class="hud-card level-card">
            LEVEL <span id="level">1</span>
        </div>

        <div class="hud-card control-card">
            ARROW / WASD / TOUCH
        </div>

    </div>


    <!-- MOBILE CONTROL -->
    <div id="mobileControls" class="hidden">

        <button id="upButton" class="control-button">UP</button>

        <div class="horizontal-controls">
            <button id="leftButton" class="control-button">LEFT</button>
            <button id="rightButton" class="control-button">RIGHT</button>
        </div>

        <button id="downButton" class="control-button">DOWN</button>

    </div>


    <!-- NICE -->
    <div id="niceText">NICE! +1</div>


    <!-- GAME OVER -->
    <div id="gameOverScreen" class="screen hidden">

        <div class="game-over-panel">

            <div class="x-icon">
                <span></span>
                <span></span>
            </div>

            <h1>GAME OVER</h1>

            <p class="final-score">
                Skor Akhir: <span id="finalScore">0</span>
            </p>

            <div class="game-over-buttons">

                <button id="restartButton" class="main-button">
                    RESTART
                </button>

                <button id="exitGameButton" class="exit-button">
                    KELUAR
                </button>

            </div>

            <p class="instruction">
                Klik tombol atau tekan R / ESC
            </p>

        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
